name: Deploy Dev
run-name: "Deploy dev (${{ github.ref_name }}@${{ github.sha }})"

# Builds, tests, packages, publishes, and deploys the current branch HEAD to dev.
# No inputs required — always targets the dev environment.

on:
  workflow_dispatch: {}

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy dev
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: dev
    permissions:
      contents: read
      id-token: write

    steps:
      # Checkout the current branch HEAD
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      # Setup Node.js runtime
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn

      # Install dependencies from the lockfile
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Run automated tests before packaging
      - name: Run tests
        run: yarn test --passWithNoTests

      # Clean, build, and package Lambda and layer artifacts into ZIP files
      - name: Package artifacts
        run: yarn package

      # Verify that all expected ZIP artifacts exist
      - name: Verify ZIP artifacts
        shell: bash
        run: |
          set -euo pipefail

          echo "Listing dist directory:"
          ls -lah dist

          test -f dist/emobility-backend.zip
          test -f dist/common-layer.zip
          test -f dist/node-modules-layer.zip

          echo "All expected ZIP artifacts are present."

      # Configure AWS access via GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: eu-central-1

      # Resolve the version to a short SHA (7 chars)
      - name: Set version
        id: set-version
        shell: bash
        run: echo "value=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Upload artifacts to the shared S3 artifact store (skip if already exists)
      - name: Publish artifacts to S3
        shell: bash
        env:
          ARTIFACT_STORE: ${{ vars.ARTIFACT_STORE }}
          VERSION: ${{ steps.set-version.outputs.value }}
        run: |
          set -euo pipefail

          upload_if_not_exists() {
            local src="$1"
            local dst="$2"
            if aws s3 ls "$dst" > /dev/null 2>&1; then
              echo "::notice::Skipping ${src} (version: ${VERSION}): already exists at ${dst}"
            else
              echo "Uploading ${src} to ${dst} (version: ${VERSION})"
              aws s3 cp "$src" "$dst"
            fi
          }

          upload_if_not_exists "dist/emobility-backend.zip" "s3://${ARTIFACT_STORE}/emobility-backend-${VERSION}.zip"
          upload_if_not_exists "dist/common-layer.zip" "s3://${ARTIFACT_STORE}/layers/common-layer-${VERSION}.zip"
          upload_if_not_exists "dist/node-modules-layer.zip" "s3://${ARTIFACT_STORE}/layers/node-modules-layer-${VERSION}.zip"

      # Authenticate using GitHub App (required for cross-repo access to Terraform repo)
      - name: Authenticate as GitHub App
        id: app-auth
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: SFOE-Prometheon

      # Checkout the dev Terraform repository
      - name: Checkout Terraform repo
        uses: actions/checkout@v5
        with:
          repository: SFOE-prometheon/prometheon-emobility-dev
          token: ${{ steps.app-auth.outputs.token }}
          path: tf-repo

      # Update backend version and deploy to dev
      - name: Update version and deploy
        shell: bash
        env:
          VERSION: ${{ steps.set-version.outputs.value }}
        run: |
          set -euo pipefail
          cd tf-repo
          sed -i "s/backend_app_version = \".*\"/backend_app_version = \"${VERSION}\"/" deploy.auto.tfvars
          git config user.name "GitHub Actions"
          git config user.email "noreply@github.com"
          git add deploy.auto.tfvars
          git commit -m "chore(deploy): deploy backend SHA ${VERSION}"
          git push
