name: Deploy Tag
run-name: "Deploy ${{ inputs.tag }} to ${{ inputs.environment }}"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        required: true
        type: environment
      tag:
        description: "Git Tag (e.g. 1.0.0)"
        required: true
        type: string

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Tag v${{ inputs.tag }} to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write

    steps:
      # Verify that Git tag exists in current repository
      - name: Verify Git tag exists
        uses: actions/github-script@v7
        env:
          TAG: ${{ inputs.tag }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = process.env.TAG;

            try {
              await github.rest.git.getRef({
                owner,
                repo,
                ref: `tags/${tag}`,
              });
              core.info(`Tag '${tag}' exists.`);
            } catch (e) {
              if (e.status === 404) {
                core.setFailed(`Tag '${tag}' does not exist. Aborting deployment.`);
              } else {
                throw e;
              }
            }

      # Configure AWS access via GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: eu-central-1

      # Verify that the artifact for the given tag exists in S3
      - name: Verify artifact exists in S3
        shell: bash
        env:
          ARTIFACT_STORE: ${{ vars.ARTIFACT_STORE }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          artifact="s3://${ARTIFACT_STORE}/emobility-backend-${TAG}.zip"
          if ! aws s3 ls "$artifact" > /dev/null 2>&1; then
            echo "Error: Artifact '${artifact}' not found in S3. Run package-and-publish first."
            exit 1
          fi
          echo "Artifact '${artifact}' exists."

      # Authenticate using GitHub App (required for cross-repo access)
      - name: Authenticate as GitHub App
        id: app-auth
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: SFOE-Prometheon

      # Checkout Terraform repository for the target environment
      - name: Checkout Terraform repo
        uses: actions/checkout@v5
        with:
          repository: SFOE-prometheon/prometheon-emobility-${{ inputs.environment }}
          token: ${{ steps.app-auth.outputs.token }}
          path: tf-repo

      # Update backend version inside Terraform variables
      - name: Update version
        shell: bash
        run: |
          set -euo pipefail
          cd tf-repo
          sed -i "s/backend_app_version = \".*\"/backend_app_version = \"${{ inputs.tag }}\"/" deploy.auto.tfvars

      # Commit and push changes to Terraform repository
      - name: Commit & push changes
        shell: bash
        run: |
          set -euo pipefail
          cd tf-repo
          git config user.name "GitHub Actions"
          git config user.email "noreply@github.com"
          git add deploy.auto.tfvars
          git commit -m "chore(deploy): deploy backend version ${{ inputs.tag }}"
          git push
