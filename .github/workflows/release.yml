name: Release
run-name: "Release (${{ github.sha }})"

# On every push to main, semantic-release derives the next version from the Conventional
# Commit messages since the last tag (feat -> minor; fix, perf, refactor, revert -> patch;
# BREAKING CHANGE -> major; docs, ci, chore, test, style, build -> no release), tags it
# (no "v" prefix, e.g. 0.7.0) and creates a GitHub release with generated notes. Nothing is
# committed back to main. A new release is then published and deployed to dev via
# publish-deploy-tag; test and prod are promoted manually with the same workflow and tag.

on:
  push:
    branches: [ main ]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}

    steps:
      # Full history and tags, so semantic-release finds the last release
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Uses .releaserc.json; tags and the GitHub release are created with GITHUB_TOKEN
      - name: Semantic release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 24
          extra_plugins: |
            conventional-changelog-conventionalcommits@8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-dev:
    name: Deploy ${{ needs.release.outputs.version }} to dev
    needs: release
    if: needs.release.outputs.published == 'true'
    uses: ./.github/workflows/publish-deploy-tag.yml
    with:
      environment: dev
      tag: ${{ needs.release.outputs.version }}
    permissions:
      contents: read
      id-token: write
    secrets: inherit
