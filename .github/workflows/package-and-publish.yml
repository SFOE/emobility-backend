name: Package & Publish
run-name: "Package & Publish ${{ inputs.environment }}${{ inputs.tag != '' && format(' ({0})', inputs.tag) || '' }}"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        required: true
        type: environment
      tag:
        description: "Git tag for test/prod (e.g. 1.0.0). Not required for dev."
        required: false
        type: string

concurrency:
  group: package-publish-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  package-publish:
    name: Package & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    outputs:
      version: ${{ steps.set-version.outputs.value }}
    permissions:
      id-token: write

    steps:
      # Validate workflow inputs before running the pipeline
      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ inputs.environment }}" == "dev" ]]; then
            if [[ -n "${{ inputs.tag }}" ]]; then
              echo "Warning: 'tag' is ignored for dev deployments. Deploying branch HEAD."
            else
              echo "Dev deployment: no tag required, deploying branch HEAD."
            fi
          else
            if [[ -z "${{ inputs.tag }}" ]]; then
              echo "Error: 'tag' is required for test and prod deployments."
              exit 1
            fi
          fi

      # Verify that the requested tag exists for test/prod
      - name: Verify Git tag exists
        if: inputs.environment != 'dev'
        uses: actions/github-script@v7
        env:
          TAG: ${{ inputs.tag }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = process.env.TAG;

            try {
              await github.rest.git.getRef({
                owner,
                repo,
                ref: `tags/${tag}`,
              });
              core.info(`Tag '${tag}' exists.`);
            } catch (e) {
              if (e.status === 404) {
                core.setFailed(`Tag '${tag}' does not exist. Aborting workflow.`);
              } else {
                throw e;
              }
            }

      # Checkout selected branch (dev) or specific tag (test/prod)
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.environment == 'dev' && github.ref || inputs.tag }}
          fetch-depth: 0

      # Setup Node.js runtime for the workflow
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn

      # Install dependencies from the lockfile
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Run automated tests before packaging
      - name: Run tests
        run: yarn test --passWithNoTests

      # Build TypeScript output
      - name: Build application
        run: yarn build

      # Package Lambda and layer artifacts into ZIP files
      - name: Package artifacts
        run: yarn package

      # Verify that all expected ZIP artifacts exist
      - name: Verify ZIP artifacts
        shell: bash
        run: |
          set -euo pipefail

          echo "Listing dist directory:"
          ls -lah dist

          test -f dist/emobility-backend.zip
          test -f dist/common-layer.zip
          test -f dist/node-modules-layer.zip

          echo "All expected ZIP artifacts are present."

      # Configure AWS access via GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: eu-central-1

      # Resolve version: SHA for dev, tag for test/prod
      - name: Set version
        id: set-version
        shell: bash
        run: |
          if [[ "${{ inputs.environment }}" == "dev" ]]; then
            echo "value=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      # Publish artifacts to the configured S3 bucket
      - name: Publish artifacts
        shell: bash
        env:
          ARTIFACT_STORE: ${{ vars.ARTIFACT_STORE }}
          VERSION: ${{ steps.set-version.outputs.value }}
        run: |
          set -euo pipefail

          upload_if_not_exists() {
            local src="$1"
            local dst="$2"
            if aws s3 ls "$dst" > /dev/null 2>&1; then
              echo "Skipping ${src}: already exists at ${dst}"
            else
              echo "Uploading ${src} to ${dst}"
              aws s3 cp "$src" "$dst"
            fi
          }

          upload_if_not_exists "dist/emobility-backend.zip" "s3://${ARTIFACT_STORE}/emobility-backend-${VERSION}.zip"
          upload_if_not_exists "dist/common-layer.zip" "s3://${ARTIFACT_STORE}/layers/common-layer-${VERSION}.zip"
          upload_if_not_exists "dist/node-modules-layer.zip" "s3://${ARTIFACT_STORE}/layers/node-modules-layer-${VERSION}.zip"

      # Authenticate using GitHub App (required for cross-repo access to Terraform repo)
      - name: Authenticate as GitHub App
        if: inputs.environment == 'dev'
        id: app-auth
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: SFOE-Prometheon

      # Checkout Terraform repository for dev and update backend version
      - name: Checkout Terraform repo
        if: inputs.environment == 'dev'
        uses: actions/checkout@v5
        with:
          repository: SFOE-prometheon/prometheon-emobility-dev
          token: ${{ steps.app-auth.outputs.token }}
          path: tf-repo

      - name: Deploy to dev
        if: inputs.environment == 'dev'
        env:
          VERSION: ${{ steps.set-version.outputs.value }}
        run: |
          cd tf-repo
          sed -i "s/backend_app_version = \".*\"/backend_app_version = \"${VERSION}\"/" deploy.auto.tfvars
          git config user.name "GitHub Actions"
          git config user.email "noreply@github.com"
          git add deploy.auto.tfvars
          git commit -m "chore(deploy): deploy backend SHA ${VERSION:0:7}"
          git push
