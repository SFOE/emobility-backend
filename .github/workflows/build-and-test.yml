name: Build & Test
run-name: "Build & Test (${{ github.head_ref || github.ref_name }})"

# Runs on every push to main and on pull requests targeting main.
# Validates that the codebase builds and all tests pass.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      # Checkout the branch or PR HEAD
      - name: Checkout
        uses: actions/checkout@v5

      # Setup Node.js runtime
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn

      # Install dependencies from the lockfile
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Lint the codebase
      - name: Lint codebase
        run: yarn lint

      # Run automated tests
      - name: Run tests
        run: yarn test:unit

      # Build TypeScript output
      - name: Build application
        run: yarn build
